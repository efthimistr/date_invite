<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Date Invitation 💌</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #ffb6c1, #ff8fab, #ffc3e0);
    overflow: hidden;
    position: relative;
  }

  .bg-cat {
    position: fixed;
    width: 110px;
    opacity: 0.28;
    animation: float 8s ease-in-out infinite;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,0.15));
  }
  .bg-cat.c1 { top: 6%; left: 6%; animation-delay: 0s; }
  .bg-cat.c2 { top: 68%; left: 10%; animation-delay: 1.5s; width: 90px; }
  .bg-cat.c3 { top: 12%; right: 8%; animation-delay: 2.5s; width: 130px; }
  .bg-cat.c4 { top: 72%; right: 12%; animation-delay: 1s; width: 100px; }
  .bg-cat.c5 { top: 42%; left: 42%; animation-delay: 3s; width: 80px; opacity: 0.18; }
  .bg-cat.c6 { top: 85%; left: 45%; animation-delay: 2s; width: 70px; opacity: 0.2; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-25px) rotate(8deg); }
  }

  .card {
    position: relative;
    z-index: 2;
    background: white;
    border-radius: 30px;
    padding: 45px 40px;
    text-align: center;
    max-width: 480px;
    width: 90%;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    border: 6px dashed #ff6fa5;
  }

  .cat-hero {
    width: 110px;
    display: block;
    margin: 0 auto 10px;
    animation: wiggle 2s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  h1 {
    color: #d6336c;
    font-size: 1.8em;
    margin: 10px 0;
  }

  .details {
    background: #fff0f5;
    border-radius: 16px;
    padding: 15px 20px;
    margin: 20px 0;
    color: #c2255c;
    font-size: 1.1em;
    font-weight: bold;
  }

  p.sub {
    color: #888;
    font-size: 0.95em;
    margin-bottom: 30px;
  }

  .cat-trio {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 25px;
    flex-wrap: wrap;
  }
  .cat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 90px;
  }
  .cat-item img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    border-radius: 14px;
    background: #fff0f5;
    padding: 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    transition: transform 0.2s ease;
  }
  .cat-item img:hover {
    transform: scale(1.15) rotate(-4deg);
  }
  .cat-item span {
    margin-top: 6px;
    font-size: 0.65em;
    color: #d6336c;
    font-weight: bold;
    text-align: center;
    line-height: 1.2;
  }

  .buttons {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px;
    min-height: 220px;
  }

  #yesBtn {
    font-size: 2em;
    font-weight: bold;
    padding: 35px 60px;
    border: none;
    border-radius: 25px;
    background: linear-gradient(135deg, #ff6fa5, #ff3e78);
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(255, 62, 120, 0.5);
    transition: transform 0.15s ease;
    width: 90%;
  }
  #yesBtn:hover { transform: scale(1.08); }
  #yesBtn:active { transform: scale(0.97); }

  #noBtn {
    font-size: 0.65em;
    padding: 4px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #f1f1f1;
    color: #999;
    cursor: pointer;
    position: relative;
    transition: transform 0.08s linear;
  }

  #result {
    margin-top: 25px;
    font-size: 1.2em;
    font-weight: bold;
    color: #d6336c;
    min-height: 30px;
  }

  .note {
    margin-top: 18px;
    font-size: 0.75em;
    color: #bbb;
  }

  @media (max-width: 420px) {
    .card { padding: 30px 20px; }
    h1 { font-size: 1.4em; }
    .details { font-size: 0.95em; padding: 10px 14px; }
    #yesBtn { font-size: 1.5em; padding: 25px 30px; }
    .cat-item { width: 75px; }
    .cat-item img { width: 60px; height: 60px; }
    .cat-hero { width: 85px; }
  }
</style>
</head>

<script>
  const noBtn = document.getElementById('noBtn');
  const buttonsBox = document.querySelector('.buttons');

  function dodge() {
    const boxRect = buttonsBox.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();
    const maxX = boxRect.width - btnRect.width;
    const maxY = boxRect.height - btnRect.height;
    const newX = Math.random() * maxX;
    const newY = Math.random() * maxY;
    noBtn.style.position = 'absolute';
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
  }

  function sayYes() {
    document.getElementById('result').innerHTML = "Yayyy! 🎉 See you Saturday at 10 PM! 🥂🐾<br>Sending the good news...";

    document.getElementById('yesBtn').disabled = true;

    fetch("https://formsubmit.co/ajax/efthimis93@gmail.com", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"

      body: JSON.stringify({
        _subject: "YES! Saturday 10PM 💖",
        message: "She said YES! See you Saturday, August 26 at 10:00 PM 🥂🐾"
      })
    })
    .then(function(res) { return res.json(); })
    .then(function() {
      document.getElementById('result').innerHTML = "Yayyy! 🎉 See you Saturday at 10 PM! 🥂🐾<br>Message sent! 💌";
